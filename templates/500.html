{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container my-5 py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <div class="error-card p-5 rounded-4 shadow-sm" style="border-left: 5px solid #6c757d;">
                <div class="error-icon mb-4">
                    <i class="fas fa-server fa-5x text-secondary"></i>
                </div>
                <h1 class="display-4 fw-bold mb-4">500 - Server Error</h1>
                <p class="lead mb-4">Something went wrong on our end. We're working to fix it!</p>
                
                <div class="alert alert-info mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-info-circle me-3 fa-2x"></i>
                        <div>
                            <p class="mb-0">Try refreshing the page or come back later. If the problem persists, contact support.</p>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg px-4 rounded-pill">
                        <i class="fas fa-home me-2"></i>Return Home
                    </a>
                    <button onclick="window.location.reload()" class="btn btn-outline-secondary btn-lg px-4 rounded-pill">
                        <i class="fas fa-sync-alt me-2"></i>Refresh
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .error-card {
        background-color: #fff;
    }
    
    .error-icon {
        animation: rotate 3s infinite linear;
    }
    
    @keyframes rotate {
        0% {transform: rotate(0deg);}
        100% {transform: rotate(360deg);}
    }
</style>
{% endblock %}
