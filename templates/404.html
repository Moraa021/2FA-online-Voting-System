{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container my-5 py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <div class="error-card p-5 rounded-4 shadow-sm">
                <div class="error-icon mb-4">
                    <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
                </div>
                <h1 class="display-4 fw-bold mb-4">404 - Page Not Found</h1>
                <p class="lead mb-4">Oops! The page you're looking for doesn't exist or has been moved.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg px-4 rounded-pill">
                        <i class="fas fa-home me-2"></i>Return Home
                    </a>
                    <a href="{{ url_for('elections') }}" class="btn btn-outline-primary btn-lg px-4 rounded-pill">
                        <i class="fas fa-vote-yea me-2"></i>View Elections
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .error-card {
        background-color: #fff;
        border-left: 5px solid #ffc107;
    }
    
    .error-icon {
        animation: bounce 2s infinite;
    }
    
    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
        40% {transform: translateY(-20px);}
        60% {transform: translateY(-10px);}
    }
</style>
{% endblock %}
